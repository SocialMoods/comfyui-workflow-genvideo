name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo apt-get clean
          docker system prune -af

      - name: Build Docker image
        run: |
          IMAGE_TAG=$(date +%s)
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          docker build . --file Dockerfile --tag ${{ secrets.DOCKER_USERNAME }}/worker-comfyui-influence:$IMAGE_TAG
          docker tag ${{ secrets.DOCKER_USERNAME }}/worker-comfyui-influence:$IMAGE_TAG ${{ secrets.DOCKER_USERNAME }}/worker-comfyui-influence:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/worker-comfyui-influence:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/worker-comfyui-influence:latest